[package]
name = "typographus-log"
version = "0.1.0"
edition = "2024"

[dependencies]
once_cell = "1.21.3"
time = { version = "0.3.43", features = ["formatting", "parsing", "local-offset"] }
anstyle = "1.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "registry", "tracing-log"] }
eyre = { version = "0.6.14", optional = true }
tracing-log = { version = "0.2.0", default-features = false, features = ["log-tracer", "std"] }

[features]
eyre = ["dep:eyre"]

[dev-dependencies]
log = "0.4.28"
thiserror = "2.0.21"

[[example]]
name = "showcase"
required-features = ["eyre"]
