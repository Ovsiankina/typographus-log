[package]
name = "typographus-log"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Ovsiankina/typographus-log"
readme = "README.md"
keywords = ["tracing", "logging", "error", "eyre", "terminal"]
exclude = [".github", ".cargo", "AGENTS.md", "scripts", "src/guideline.md"]
categories = ["development-tools::debugging", "command-line-interface"]
description = "Pretty, opinionated terminal output for tracing events, errors and panics"

[dependencies]
once_cell = "1.21.3"
time = { version = "0.3.43", features = ["local-offset"] }
anstyle = "1.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "registry", "tracing-log"] }
eyre = { version = "0.6.14", optional = true }
tracing-log = { version = "0.2.0", default-features = false, features = ["log-tracer", "std"] }

[features]
eyre = ["dep:eyre"]

[dev-dependencies]
log = "0.4.28"
thiserror = "2.0.21"

[[example]]
name = "showcase"
required-features = ["eyre"]
